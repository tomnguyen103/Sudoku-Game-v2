<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c">
      <rect x="2" y="2" width="96" height="96" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="8" fill="#f1f5f9"/>
  <rect x="2" y="2" width="96" height="96" rx="6" fill="white"/>

  <g clip-path="url(#c)">
    <!-- Thin vertical cell dividers -->
    <line x1="13" y1="2" x2="13" y2="98" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="24" y1="2" x2="24" y2="98" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="45" y1="2" x2="45" y2="98" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="55" y1="2" x2="55" y2="98" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="77" y1="2" x2="77" y2="98" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="87" y1="2" x2="87" y2="98" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Thick vertical box borders (after col 3 and col 6) -->
    <line x1="34" y1="2" x2="34" y2="98" stroke="#475569" stroke-width="3"/>
    <line x1="66" y1="2" x2="66" y2="98" stroke="#475569" stroke-width="3"/>

    <!-- Thin horizontal cell dividers -->
    <line x1="2" y1="13" x2="98" y2="13" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="2" y1="24" x2="98" y2="24" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="2" y1="45" x2="98" y2="45" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="2" y1="55" x2="98" y2="55" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="2" y1="77" x2="98" y2="77" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="2" y1="87" x2="98" y2="87" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Thick horizontal box borders (after row 3 and row 6) -->
    <line x1="2" y1="34" x2="98" y2="34" stroke="#475569" stroke-width="3"/>
    <line x1="2" y1="66" x2="98" y2="66" stroke="#475569" stroke-width="3"/>

    <!-- Sample numbers (visible at larger favicon sizes, adds texture at small) -->
    <text x="7"  y="32"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">3</text>
    <text x="18" y="22"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">9</text>
    <text x="40" y="32"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">7</text>
    <text x="73" y="22"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">1</text>
    <text x="7"  y="43"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">8</text>
    <text x="18" y="43"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">5</text>
    <text x="62" y="43"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">7</text>
    <text x="7"  y="54"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">1</text>
    <text x="40" y="54"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">2</text>
    <text x="51" y="54"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">5</text>
    <text x="7"  y="76"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">4</text>
    <text x="51" y="76"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">6</text>
    <text x="84" y="76"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">3</text>
    <text x="18" y="87"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">5</text>
    <text x="36" y="87"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">7</text>
    <text x="62" y="87"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">3</text>
    <text x="7"  y="98"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">7</text>
    <text x="51" y="98"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">9</text>
    <text x="62" y="98"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">3</text>
    <text x="73" y="98"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">2</text>
    <text x="84" y="98"  font-family="sans-serif" font-weight="700" font-size="9" fill="#1e3a5f">5</text>
  </g>

  <!-- Outer border drawn last so it sits on top -->
  <rect x="2" y="2" width="96" height="96" rx="6" fill="none" stroke="#374151" stroke-width="3"/>
</svg>
