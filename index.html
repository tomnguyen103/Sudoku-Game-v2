<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Solver Visualizer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="vendor/tailwindcss.js?v=20260526-dlx"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script defer src="vendor/alpine.min.js?v=20260526-dlx"></script>
  <link rel="stylesheet" href="style.css?v=20260526-dlx">
  <script src="src/solver.js?v=20260526-dlx"></script>
  <script src="src/generator.js?v=20260526-dlx"></script>
  <script src="src/visualizer.js?v=20260526-dlx"></script>
</head>
<body
  class="min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors duration-200 px-3 py-4 sm:p-5"
  x-data="sudokuGame()"
  x-init="init()"
>
  <header class="flex items-center justify-between max-w-5xl mx-auto mb-4 sm:mb-5">
    <div>
      <h1 class="text-2xl sm:text-3xl font-black tracking-widest text-slate-900 dark:text-slate-100">SUDOKU</h1>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400" x-text="subtitleText()"></p>
    </div>
    <button
      @click="toggleDark()"
      class="inline-flex h-10 w-10 items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors"
      :aria-label="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      :title="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <svg x-show="!darkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg x-show="darkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M20.99 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.78 9.79Z"></path>
      </svg>
    </button>
  </header>

  <main class="flex flex-col lg:flex-row items-start justify-start gap-5 sm:gap-6 max-w-5xl mx-auto">
    <div class="sudoku-grid w-full max-w-[31rem] lg:max-w-[40.375rem]">
      <template x-for="cell in cells()" :key="cell.key">
        <div
          class="sudoku-cell"
          :aria-label="cell.value ? `Row ${cell.row + 1}, column ${cell.col + 1}, ${cell.value}` : `Row ${cell.row + 1}, column ${cell.col + 1}, empty`"
          :class="{
            'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100': cellKind(cell.row, cell.col) === 'given',
            'bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300': cellKind(cell.row, cell.col) === 'generated' && !isCurrentCell(cell.row, cell.col),
            'bg-white dark:bg-slate-900 text-transparent': cellKind(cell.row, cell.col) === 'empty' && !isCurrentCell(cell.row, cell.col),
            'bg-amber-200 dark:bg-amber-800 text-amber-950 dark:text-amber-100': isPlacingCell(cell.row, cell.col),
            'bg-violet-200 dark:bg-violet-900 text-violet-950 dark:text-violet-100': isGuessCell(cell.row, cell.col),
            'bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-300': isBacktracked(cell.row, cell.col) || isContradictionCell(cell.row, cell.col),
            'finish-flash': finishFlash && cellKind(cell.row, cell.col) !== 'given',
            'fish-base': isFishBaseCell(cell.row, cell.col),
            'fish-cover': isFishCoverLine(cell.row, cell.col),
            'bg-amber-200 dark:bg-amber-700/60': isSaSwapCell(cell.row, cell.col),
          }"
        >
          <template x-if="cell.value">
            <span x-text="cell.value"></span>
          </template>
          <template x-if="!cell.value && cell.candidates">
            <div class="cell-candidates">
              <template x-for="d in [1,2,3,4,5,6,7,8,9]" :key="d">
                <span class="cell-candidate" x-text="cell.candidates.includes(d) ? d : ''"></span>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>

    <aside class="w-full max-w-[31rem] lg:w-[21.5rem] lg:h-[40.375rem] flex flex-col gap-3">
      <section class="difficulty-panel bg-white dark:bg-slate-800 rounded-lg p-3 shadow-sm ring-1 ring-slate-200/70 dark:ring-slate-700/70">
        <div class="text-xs text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Difficulty</div>
        <div class="grid grid-cols-3 gap-1.5">
          <template x-for="d in ['easy','medium','hard']" :key="d">
            <button
              @click="setDifficulty(d)"
              :disabled="status === 'running' || status === 'loading'"
              :class="difficulty === d
                ? 'bg-blue-600 text-white'
                : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'"
              class="capitalize text-sm font-semibold py-2 rounded-md transition-colors disabled:opacity-60"
              x-text="d"
            ></button>
          </template>
        </div>
      </section>

      <section class="algo-ring bg-white dark:bg-slate-800 rounded-lg p-3 shadow-sm">
        <div class="text-xs uppercase tracking-wider mb-2 font-bold text-violet-400 dark:text-violet-400">⬡ Algorithm</div>
        <select
          x-model="selectedAlgorithm"
          @change="setAlgorithm($event.target.value)"
          :disabled="status === 'running' || status === 'loading'"
          class="algo-select mb-3 disabled:opacity-60"
        >
          <option value="backtracking">⬡ Backtracking DFS</option>
          <option value="mrv">⬡ Backtracking + MRV</option>
          <option value="constraint">⬡ Constraint Propagation</option>
          <option value="human">⬡ Human Logic Solver</option>
          <option value="human-v2">⬡ Human Logic Solver v2</option>
          <option value="human-v3">⬡ Human Logic Solver v3</option>
          <option value="sa">⬡ Simulated Annealing</option>
          <option value="dlx">⬡ Knuth's Algorithm X (DLX)</option>
        </select>
        <button
          @click="runSolver()"
          :disabled="status === 'running' || status === 'loading'"
          class="w-full py-3 text-sm font-bold rounded-lg bg-blue-600 text-white hover:bg-blue-500 transition-colors shadow-sm disabled:opacity-60 mb-2"
        x-text="status === 'paused' ? 'Continue' : 'Run Algorithm'"></button>
        <div class="text-xs font-bold uppercase tracking-widest mb-1.5 text-violet-700 dark:text-violet-500">Speed</div>
        <div class="grid grid-cols-4 gap-1.5 mb-3">
          <template x-for="option in ['1x','2x','5x','10x']" :key="option">
            <button
              @click="setSpeed(option)"
              :class="speed === option
                ? 'bg-blue-600 text-white'
                : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'"
              class="text-sm font-bold py-2 rounded-md transition-colors"
              x-text="option"
            ></button>
          </template>
        </div>
        <hr class="border-slate-200 dark:border-slate-600 mb-3">
        <div class="grid grid-cols-2 gap-2 mb-2">
          <button
            @click="pauseSolver()"
            :disabled="status !== 'running'"
            class="py-3 text-sm font-bold rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition-colors disabled:opacity-60"
          >Pause</button>
          <button
            @click="finishNow()"
            :disabled="status === 'solved' || status === 'loading'"
            class="py-3 text-sm font-bold rounded-lg bg-emerald-600 text-white hover:bg-emerald-500 transition-colors shadow-sm disabled:opacity-60"
          >Finish Now</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button
            @click="resetPuzzle()"
            class="py-3 text-sm font-bold rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition-colors"
          >Reset</button>
          <button
            @click="newPuzzle()"
            :disabled="status === 'running' || status === 'loading'"
            class="py-3 text-sm font-bold rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 hover:bg-slate-700 dark:hover:bg-white transition-colors shadow-sm disabled:opacity-60"
          >New Puzzle</button>
        </div>
      </section>

      <section class="status-panel bg-white dark:bg-slate-800 rounded-lg p-3 shadow-sm ring-1 ring-slate-200/70 dark:ring-slate-700/70 lg:flex-1 lg:flex lg:flex-col lg:justify-between">
        <div class="status-header">
          <div class="text-xs text-slate-400 dark:text-slate-500 uppercase tracking-wider">Status</div>
          <span class="algo-badge" x-text="algorithmBadgeLabel()"></span>
        </div>
        <div class="grid grid-cols-4 gap-1.5 mb-2">
          <div class="stat-place">
            <div class="stat-label" x-text="statLabelPrimary()"></div>
            <div class="stat-value" x-text="statValuePrimary()"></div>
          </div>
          <div class="stat-back">
            <div class="stat-label" x-text="statLabelSecondary()"></div>
            <div class="stat-value" x-text="statValueSecondary()"></div>
          </div>
          <div class="stat-time">
            <div class="stat-label">⏱ Solving Time</div>
            <div class="stat-value" x-text="elapsedText()"></div>
          </div>
          <div class="stat-time">
            <div class="stat-label">⏱ Compute Time</div>
            <div class="stat-value" x-text="computeText()"></div>
          </div>
        </div>
        <p class="text-xs text-center text-slate-500 dark:text-slate-400" x-text="statusText()"></p>
      </section>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
        navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
      });
    }
  </script>
</body>
</html>
